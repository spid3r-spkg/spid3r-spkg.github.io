name: Verify Package Registry

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject committed private signing keys
        run: |
          if find . -maxdepth 4 -name "*.key" | grep -q .; then
            echo "ERROR: Private signing key files (*.key / registry.key) must never be committed!"
            exit 1
          fi
      - name: Enforce release immutability on Pull Requests
        if: github.event_name == 'pull_request'
        shell: python3 {0}
        run: |
          import subprocess, sys

          base = "${{ github.event.pull_request.base.sha }}"
          out = subprocess.check_output(["git", "diff", "--name-status", base, "HEAD"], text=True)
          for line in out.splitlines():
              if not line.strip():
                  continue
              parts = line.split("\t")
              status, path = parts[0], parts[1]
              if path in ("registry.pub", "registry.toml") and status != "A":
                  sys.exit(f"PR cannot modify or delete {path} ({status})")
              segs = path.split("/")
              if len(segs) >= 3 and status != "A" and not segs[0].startswith(".") and segs[0] != "assets":
                  sys.exit(f"Release immutability violation: PR tried to {status} existing published path {path}")
          print("PR release immutability verified.")
      - name: Validate packages, hashes, and tar safety
        shell: python3 {0}
        run: |
          import hashlib, pathlib, sys, tarfile

          RESERVED = {"CON", "PRN", "AUX", "NUL"} | {f"COM{i}" for i in range(1, 10)} | {f"LPT{i}" for i in range(1, 10)}
          root = pathlib.Path(".")
          catalog_path = root / "catalog.txt"
          if not catalog_path.is_file():
              sys.exit("catalog.txt is missing")

          skip = {".git", ".github", "assets"}
          pkg_dirs = sorted(
              d for d in root.iterdir()
              if d.is_dir() and d.name not in skip and not d.name.startswith(".")
          )
          if not pkg_dirs:
              sys.exit("Registry has no package directories")

          def tree_hash(src_dir: pathlib.Path) -> str:
              files = sorted(p for p in src_dir.rglob("*") if p.is_file())
              h = hashlib.sha256()
              for f in files:
                  rel = f.relative_to(src_dir).as_posix().encode("utf-8")
                  h.update(rel)
                  h.update(b"\x00")
                  h.update(f.read_bytes())
                  h.update(b"\x00")
              return h.hexdigest()

          catalog_names = set()
          for line in catalog_path.read_text(encoding="utf-8").splitlines():
              s = line.strip()
              if s and not s.startswith("#"):
                  catalog_names.add(s.split("\t")[0].strip())

          for pkg in pkg_dirs:
              idx = pkg / "index.txt"
              if not idx.is_file():
                  sys.exit(f"{pkg}: missing index.txt")
              versions = [v.strip() for v in idx.read_text(encoding="utf-8").splitlines() if v.strip() and not v.strip().startswith("#")]
              if not versions:
                  sys.exit(f"{pkg}/index.txt has no versions")
              if pkg.name not in catalog_names:
                  sys.exit(f"{pkg.name} missing from catalog.txt")
              for ver in versions:
                  vdir = pkg / ver
                  for req in ("spider.toml", "sha256.txt", "package.tar"):
                      if not (vdir / req).is_file():
                          sys.exit(f"{vdir}: missing {req}")
                  expected = (vdir / "sha256.txt").read_text(encoding="utf-8").strip()
                  actual = tree_hash(vdir / "src")
                  if expected != actual:
                      sys.exit(f"{vdir}: sha256.txt mismatch ({expected} != {actual})")
                  seen_lower = set()
                  with tarfile.open(vdir / "package.tar", "r") as tf:
                      for member in tf.getmembers():
                          if member.islnk() or member.issym() or ":" in member.name or "\\" in member.name or member.name.startswith("/"):
                              sys.exit(f"{vdir}/package.tar: unsafe member {member.name}")
                          parts = pathlib.PurePosixPath(member.name).parts
                          if ".." in parts:
                              sys.exit(f"{vdir}/package.tar: traversal path {member.name}")
                          for part in parts:
                              stem = part.split(".")[0].upper()
                              if stem in RESERVED or part.endswith(".") or part.endswith(" "):
                                  sys.exit(f"{vdir}/package.tar: invalid/reserved name {member.name}")
                          low = member.name.lower()
                          if low in seen_lower:
                              sys.exit(f"{vdir}/package.tar: case-colliding member {member.name}")
                          seen_lower.add(low)
          print(f"Verified {len(pkg_dirs)} package(s) successfully.")
